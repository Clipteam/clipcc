name: Restore build artifacts
description: Restore build artifacts saved by the build job in the same workflow run.

inputs:
  run-id:
    description: The workflow run ID that produced the build artifacts.
    required: true
  run-attempt:
    description: The workflow run attempt number.
    required: true

runs:
  using: composite
  steps:
    - name: Restore build artifacts
      uses: actions/cache/restore@v4
      with:
        path: |
          packages/*/dist
          packages/*/build
          packages/*/playground
          packages/gui/static/microbit
        key: build-artifacts-${{ inputs.run-id }}-${{ inputs.run-attempt }}
