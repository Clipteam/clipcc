name: Validate

on:
  push:
    branches:
      - master
      - 'dev/**'
      - community
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'yarn'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build all packages
        run: yarn run build:full

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            packages/*/dist
            packages/*/build
            packages/*/playground
            packages/audio/dist.js
            packages/gui/static/microbit
          retention-days: 1

  check-types:
    name: Check Types
    runs-on: ubuntu-latest
    outputs:
      should-run-all: ${{ steps.check-types.outputs.should-run-all }}
      gui: ${{ steps.changes.outputs.gui }}
      vm: ${{ steps.changes.outputs.vm }}
      block: ${{ steps.changes.outputs.block }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check types
        id: check-types
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [[ "${{ github.base_ref }}" == "master" ]]; then
              echo "should-run-all=true" >> $GITHUB_OUTPUT
            else
              echo "should-run-all=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "should-run-all=true" >> $GITHUB_OUTPUT
          fi

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            gui:
              - 'packages/gui/**'
              - 'packages/l10n/**'
              - 'packages/paint/**'
              - 'packages/storage/**'
            vm:
              - 'packages/vm/**'
              - 'packages/storage/**'
            block:
              - 'packages/block/**'

  test-gui:
    name: Test GUI
    needs: [build, check-types]
    runs-on: ubuntu-latest
    if: needs.check-types.outputs.gui == 'true' || needs.check-types.outputs.should-run-all == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'yarn'

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: packages/

      - name: Test
        run: yarn gui test:unit

  test-vm:
    name: Test VM
    needs: [build, check-types]
    runs-on: ubuntu-latest
    if: needs.check-types.outputs.vm == 'true' || needs.check-types.outputs.should-run-all == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'yarn'

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: packages/

      - name: Test
        run: yarn vm test

  test-block:
    name: Test Block
    needs: [build, check-types]
    runs-on: ubuntu-latest
    if: needs.check-types.outputs.block == 'true' || needs.check-types.outputs.should-run-all == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'yarn'

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: packages/

      - name: Test
        run: yarn block test
