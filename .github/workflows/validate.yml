name: Validate

on:
  push:
    branches:
      - master
      - 'dev/**'
      - community
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      should-run-all: ${{ steps.check-types.outputs.should-run-all }}
      gui: ${{ steps.changes.outputs.gui }}
      vm: ${{ steps.changes.outputs.vm }}
      block: ${{ steps.changes.outputs.block }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check types
        id: check-types
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "${{ github.base_ref }}" == "master" ]]; then
              echo "should-run-all=true" >> $GITHUB_OUTPUT
            else
              echo "should-run-all=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "should-run-all=true" >> $GITHUB_OUTPUT
          fi

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: .github/paths-filter.yml

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Build all packages
        run: yarn run build:full

      - name: Cache build artifacts
        uses: actions/cache/save@v4
        with:
          path: |
            packages/*/dist
            packages/*/build
            packages/*/playground
            packages/audio/dist.js
            packages/gui/static/microbit
          key: build-artifacts-${{ github.run_id }}-${{ github.run_attempt }}

  test-gui:
    name: Test GUI
    needs: [build]
    runs-on: ubuntu-latest
    if: needs.build.outputs.gui == 'true' || needs.build.outputs.should-run-all == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Restore build artifacts
        uses: ./.github/actions/restore-build
        with:
          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}

      - name: Test
        run: yarn gui test:unit

  test-vm:
    name: Test VM
    needs: [build]
    runs-on: ubuntu-latest
    if: needs.build.outputs.vm == 'true' || needs.build.outputs.should-run-all == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Restore build artifacts
        uses: ./.github/actions/restore-build
        with:
          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}

      - name: Test
        run: yarn vm test

  test-block:
    name: Test Block
    needs: [build]
    runs-on: ubuntu-latest
    if: needs.build.outputs.block == 'true' || needs.build.outputs.should-run-all == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Restore build artifacts
        uses: ./.github/actions/restore-build
        with:
          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}

      - name: Test
        run: yarn block test

  cleanup:
    name: Cleanup build cache
    needs: [test-gui, test-vm, test-block]
    runs-on: ubuntu-latest
    # Always run so the cache is cleaned even when tests fail or are skipped.
    if: always()
    permissions:
      actions: write
    steps:
      - name: Delete build artifacts cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache delete "build-artifacts-${{ github.run_id }}-${{ github.run_attempt }}" \
            --repo "${{ github.repository }}" || true
