name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validating Code
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.event.pull_request == null || github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: 'yarn'
      - name: Install and build
        run: yarn install --frozen-lockfile && NO_CDN=1 yarn run build:full
      - name: Test
        run: yarn test
