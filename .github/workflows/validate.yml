name: Validate

on:
  push:
    branches:
      - master
      - 'dev/**'
      - community
  pull_request:

jobs:
  validate:
    name: Validating Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: 'yarn'
      - name: Install and build
        run: yarn install --frozen-lockfile && yarn run build:full
      - name: Test
        run: yarn test
