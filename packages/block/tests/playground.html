<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<title>Test Playground</title>
	<script src="../dist/web/main.js"></script>
	<style>
		html, body {
			height: 100%;
		}

		body {
			background-color: #fff;
			font-family: sans-serif;
			overflow: hidden;
		}

		h1 {
			font-weight: normal;
			font-size: 140%;
		}

		#blocklyDiv {
			float: right;
			height: 95%;
			width: 70%;
		}

		#collaborators {
			float: right;
			width: 30px;
			margin-left: 10px;
		}

		#collaborators > img {
			margin-right: 5px;
			height: 30px;
			padding-bottom: 5px;
			width: 30px;
			border-radius: 3px;
		}

		#importExport {
			font-family: monospace;
		}
  </style>
	<script>
		const toolbox = {
			'kind': 'flyoutToolbox',
			'contents': [
				{
					'kind': 'block',
					'type': 'test_add',
					'inputs': {
						'NUM1': {
							'shadow': {
								'type': 'math_number',
								'fields': {
									'NUM': 5
								}
							}
						},
						'NUM2': {
							'shadow': {
								'type': 'math_number',
								'fields': {
									'NUM': 5
								}
							}
						}
					}
				}, {
					'kind': 'block',
					'type': 'test_field_angle',
          'inputs': {
            'DEGREES': {
							'shadow': {
								'type': 'math_angle',
								'fields': {
									'NUM': 90
								}
							}
            }
          }
        }, {
					'kind': 'block',
					'type': 'test_field_matrix',
          'inputs': {
            'MATRIX': {
							'shadow': {
								'type': 'matrix',
								'fields': {
									'MATRIX': ''
								}
							}
            }
          }
        }
			]
		};

		function start() {
			ScratchBlocks.inject('blocklyDiv', {
        media: '../media/',
        toolbox: toolbox,
        scrollbars: false,
        horizontalLayout: false,
        toolboxPosition: 'left',
        zoom: {
          controls: true,
          wheel: true,
          startScale: 0.675,
          maxScale: 4,
          minScale: 0.25,
          scaleSpeed: 1.1
        }
      });
		}
	</script>
</head>
<body onload="start()">
	<div id="collaborators"></div>
	<div id="blocklyDiv"></div>
</body>
</html>
