<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Test Playground</title>
  <script src="main.js"></script>
  <script>
    window.Blockly.Msg = window.Blockly.Msg.Msg;
  </script>
  <script src="messages.js"></script>
  <style>
    html,
    body {
      height: 100%;
    }

    body {
      background-color: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }

    h1 {
      font-weight: normal;
      font-size: 140%;
    }

    #blocklyDiv {
      float: right;
      height: 95%;
      width: 100%;
    }

    #collaborators {
      float: right;
      width: 30px;
      margin-left: 10px;
    }

    #collaborators>img {
      margin-right: 5px;
      height: 30px;
      padding-bottom: 5px;
      width: 30px;
      border-radius: 3px;
    }

    #importExport {
      font-family: monospace;
    }
  </style>
  <script>
    function start() {
      fetch('toolbox.json').then(response => response.json()).then(toolbox => {
        ScratchBlocks.inject('blocklyDiv', {
          media: '../media/',
          collapse: false,
          disable: false,
          toolbox: toolbox,
          horizontalLayout: false,
          toolboxPosition: 'left',
          move: {
            scrollbars: true,
            wheel: true
          },
          zoom: {
            controls: true,
            wheel: true,
            startScale: 0.675,
            maxScale: 4,
            minScale: 0.25,
            scaleSpeed: 1.1
          }
        });
      });
    }
  </script>
</head>

<body onload="start()">
  <!-- <div id="collaborators"></div> -->
  <div id="blocklyDiv"></div>
</body>

</html>
