<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<title>Test Playground</title>
	<script src="main.js"></script>
  <script>
    window.Blockly.Msg = window.Blockly.Msg.Msg;
  </script>
  <script src="messages.js"></script>
	<style>
		html, body {
			height: 100%;
      margin: 0px;
		}

		body {
			background-color: #fff;
			font-family: sans-serif;
			overflow: hidden;
      display: flex;
		}

    .left {
      width: 30%;
			height: 100%;
      display: flex;
      flex-direction: column;
    }

    .controlPanel {
      flex: 1;
      margin: 0.5rem;
    }

    .editorActions {
      margin: 0.5rem;
    }

    .right {
      width: 70%;
			height: 100%;
    }

		h1 {
			font-weight: normal;
			font-size: 140%;
      margin-top: 0.5rem;
      margin-left: 0.5rem;
      margin-bottom: 0px;
		}

		#blocklyDiv {
			height: 100%;
			width: 100%;
		}

    #functionDiv {
      height: 100px;
      width: 100%;
    }

		#collaborators {
			float: right;
			width: 30px;
			margin-left: 10px;
		}

		#collaborators > img {
			margin-right: 5px;
			height: 30px;
			padding-bottom: 5px;
			width: 30px;
			border-radius: 3px;
		}

		#importExport {
			font-family: monospace;
		}
  </style>
	<script>
		const toolbox = {
			kind: 'categoryToolbox',
			contents: [{
        kind: 'category',
        name: 'Category 1',
        colour: '#4C97FF',
        contents: [{
					'kind': 'block',
					'type': 'test_add',
					'inputs': {
						'NUM1': {
							'shadow': {
								'type': 'math_number',
								'fields': {
									'NUM': 5
								}
							}
						},
						'NUM2': {
							'shadow': {
								'type': 'math_number',
								'fields': {
									'NUM': 5
								}
							}
						}
					}
				}, {
					'kind': 'block',
					'type': 'test_str',
					'inputs': {
						'NUM1': {
							'shadow': {
								'type': 'text',
								'fields': {
									'TEXT': 'sss'
								}
							}
						},
						'NUM2': {
							'shadow': {
								'type': 'text',
								'fields': {
									'TEXT': 5
								}
							}
						}
					}
				}]
      }, {
        kind: 'category',
        name: 'Category 2',
        contents: [{
					'kind': 'block',
					'type': 'test_field_angle',
          'inputs': {
            'DEGREES': {
							'shadow': {
								'type': 'math_angle',
								'fields': {
									'NUM': 90
								}
							}
            }
          }
        }, {
					'kind': 'block',
					'type': 'test_field_matrix',
          'inputs': {
            'MATRIX': {
							'shadow': {
								'type': 'matrix',
								'fields': {
									'MATRIX': ''
								}
							}
            }
          }
        }, {
          'kind': 'block',
          'type': 'test_field_colour_slider',
          'inputs': {
            'COLOR': {
              'shadow': {
                'type': 'colour_picker'
              }
            }
          }
        }, {
          'kind': 'block',
          'type': 'test_field_note',
          'inputs': {
            'NOTE': {
              'shadow': {
                'type': 'note'
              }
            }
          }
        }, {
          'kind': 'block',
          'type': 'test_field_button'
        }]
      }, {
        kind: 'category',
        name: 'Variables',
        custom: 'VARIABLE'
      }, {
        kind: 'category',
        name: 'Functions',
        custom: 'PROCEDURE'
      }]
		};

    let mutationRoot = null;
    let callback = null;
    let mainWorkspace = null;
    let functionEditor = null;

		function start() {
			mainWorkspace = ScratchBlocks.inject('blocklyDiv', {
        toolbox: toolbox,
        toolboxPosition: 'left',
        media: '../media/',
        collapse: false,
        disable: false,
        toolbox: toolbox,
        horizontalLayout: false,
        toolboxPosition: 'left',
        move: {
          scrollbars: true,
          wheel: true
        },
        zoom: {
          controls: true,
          wheel: true,
          startScale: 0.675,
          maxScale: 4,
          minScale: 0.25,
          scaleSpeed: 1.1
        }
      });
      functionEditor = ScratchBlocks.injectWorkspace('functionDiv', {
        media: '../media/',
        zoom: {
          startScale: 0.75
        }
      });

      function positionDeclarationBlock(workspace, block) {
        // Keep the block centered on the workspace.
        let {viewHeight, viewWidth} = workspace.getMetrics();
        viewHeight /= workspace.scale;
        viewWidth /= workspace.scale;
        block.moveTo({
          x: viewWidth > block.width ? (viewWidth / 2) - (block.width / 2) : viewWidth - block.width,
          y: (viewHeight / 2) - (block.height / 2)
        });
      }

      functionEditor.addChangeListener(() => {
        if (mutationRoot) {
          mutationRoot.onChangeFn();
          positionDeclarationBlock(functionEditor, mutationRoot);
        }
      });

      ScratchBlocks.setExternalProcedureDefCallback((state, cb, isCreate) => {
        functionEditor.clear();
        mutationRoot = functionEditor.newBlock('procedures_declaration');
        mutationRoot.loadExtraState(state);
        mutationRoot.setMovable(false);
        mutationRoot.setDeletable(false);
        mutationRoot.contextMenu = false;
        mutationRoot.initSvg();
        positionDeclarationBlock(functionEditor, mutationRoot);
        mutationRoot.render();
        callback = cb;
      });
		}

    function addLabel() {
      if (mutationRoot) {
        mutationRoot.addLabelExternal();
      }
    }

    function addBoolean() {
      if (mutationRoot) {
        mutationRoot.addBooleanExternal();
      }
    }

    function addTextNumber() {
      if (mutationRoot) {
        mutationRoot.addStringNumberExternal();
      }
    }

    function applyMutation() {
      if (mutationRoot) {
        const state = mutationRoot.saveExtraState();
        callback(state);
        callback = null;
        mutationRoot = null;
        functionEditor.clear();
        mainWorkspace.refreshToolboxSelection();
      }
    }

    function cancel() {
      callback = null;
      mutationRoot = null;
      functionEditor.clear();
      mainWorkspace.refreshToolboxSelection();
    }

    function changeShape() {
      if (mutationRoot) {
        mutationRoot.setReturn(!mutationRoot.getReturn());
      }
    }

    function changeGlobal() {
      if (mutationRoot) {
        mutationRoot.setGlobal(!mutationRoot.getGlobal());
      }
    }
	</script>
</head>
<body onload="start()">
  <div class="left">
    <h1>Blocks Playground</h1>
    <div class="controlPanel">
    </div>
    <h1>Function Editor</h1>
    <div class="editorActions">
      <button id="text_number" onclick="addTextNumber()">Add text/number input</button>
      <button id="boolean" onclick="addBoolean()">Add boolean input</button>
      <button id="label" onclick="addLabel()">Add label</button>
      <button id="changeShape" onclick="changeShape()">Change shape</button>
      <button id="changeGlobal" onclick="changeGlobal()">Change global</button>
      <button id="cancelButton" onclick="cancel()">cancel</button>
      <button id="okButton" onclick="applyMutation()">ok</button>
    </div>
    <div id="functionDiv"></div>
  </div>
  <div class="right">
    <div id="collaborators"></div>
    <div id="blocklyDiv"></div>
  </div>
</body>
</html>
